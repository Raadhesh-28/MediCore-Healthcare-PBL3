apiVersion: apps/v1
kind: Deployment

metadata:
  name: healthcare-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: healthcare

  template:
    metadata:
      labels:
        app: healthcare

    spec:
      containers:
        - name: healthcare-container
          image: raadhesh/healthcare-app:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 80
